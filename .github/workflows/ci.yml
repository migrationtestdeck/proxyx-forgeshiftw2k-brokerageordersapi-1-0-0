name: Deploy to Kong
# Generated by forgeshift-wso2-migration-service for control plane Forgeshiftw2k.
# Metadata only: the deployment itself is the central pipeline called below. One run deploys
# one proxy; the migration service dispatches the runs one after another and tracks each by
# its tracking id. No credential lives here - the pipeline asks the tracking service for the
# Konnect token with the run's GitHub OIDC token.
run-name: Deploy ${{ inputs.proxy_name }} (${{ inputs.tracking_id }})
on:
  workflow_dispatch:
    inputs:
      proxy_name:
        description: Proxy (Kong service) to deploy
        required: true
        type: string
      proxy_id:
        description: Stable id of the proxy on this control plane
        required: true
        type: string
      tracking_id:
        description: Id of this deployment attempt
        required: true
        type: string
      commit_id:
        description: Commit to deploy (default - the head of the branch)
        required: false
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    uses: migrationtestdeck/pipeline-template-poc/.github/workflows/deploy-to-kong.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      proxy_name: ${{ inputs.proxy_name }}
      proxy_id: ${{ inputs.proxy_id }}
      tracking_id: ${{ inputs.tracking_id }}
      commit_id: ${{ inputs.commit_id }}
      control_plane_id: 'edb363b5-777a-445c-a190-5ca0d53c0c12'
      control_plane_name: 'Forgeshiftw2k'
      konnect_addr: 'https://us.api.konghq.com'
      kong_file: 'kong_deployable.yaml'
      proxy_tag_prefix: 'proxyx-proxy-id'
      deck_version: '1.62.1'
      tracking_url: 'https://probestack.io/wso2/migration/v1'
      oidc_audience: 'forgeshift-deployment-tracking'
